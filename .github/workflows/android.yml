name: Build Android APK

# Every push to main builds a signed APK and publishes it as a GitHub Release,
# so the app can be installed straight on the phone — no PC needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Third-party actions are pinned to commit SHAs so a moved tag cannot change
# what runs here. id-token/attestations sign a provenance record for the APK.
permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        timeout-minutes: 5
        run: npm test

      - name: Sync web app into Android project
        run: npm run android:sync

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      # Signing key: a repository secret if you add one, otherwise a key generated
      # once and kept in the Actions cache so new APKs install over old ones.
      # No key or password is ever stored in the repository.
      - name: Restore cached signing key
        id: keycache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.remotetv-signing
          key: remotetv-signing-v1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          dir="$HOME/.remotetv-signing"
          mkdir -p "$dir"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "RTV_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "RTV_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RTV_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ ! -f "$dir/release.p12" ]; then
            openssl rand -hex 24 > "$dir/password"
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$dir/release.p12"               -alias remotetv -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=RemoteTV" -storepass "$(cat "$dir/password")" -keypass "$(cat "$dir/password")"
          fi
          echo "::add-mask::$(cat "$dir/password")"
          echo "RTV_KEYSTORE=$dir/release.p12" >> "$GITHUB_ENV"
          echo "RTV_KEYSTORE_PASSWORD=$(cat "$dir/password")" >> "$GITHUB_ENV"
          echo "RTV_KEY_ALIAS=remotetv" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          # Build errors are also raised as annotations, readable without opening the logs.
          gradle() {
            set -o pipefail
            ./gradlew --no-daemon "$@" 2>&1 | tee -a "$RUNNER_TEMP/gradle.log" || {
              grep -E "error:|e: |FAILURE|What went wrong|^> |AAPT|Execution failed" "$RUNNER_TEMP/gradle.log" | head -n 25 | while IFS= read -r l; do echo "::error::$l"; done
              return 1
            }
          }
          # The TV Helper is built first and bundled inside the phone app, so the
          # phone can install it on the TV over ADB.
          gradle :tvhelper:assembleRelease
          mkdir -p app/src/main/assets
          cp tvhelper/build/outputs/apk/release/tvhelper-release.apk app/src/main/assets/tvhelper.apk
          gradle :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/RemoteTV-v1.1.${{ github.run_number }}.apk"
          cp tvhelper/build/outputs/apk/release/tvhelper-release.apk "$GITHUB_WORKSPACE/RemoteTV-TVHelper-v1.1.${{ github.run_number }}.apk"

      # Signed proof that this APK was built by this workflow from this commit.
      # Check with: gh attestation verify RemoteTV-v1.1.N.apk -R imuhakim/remotetv
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: RemoteTV-*.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RemoteTV-apk
          path: RemoteTV-*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: RemoteTV v1.1.${{ github.run_number }}
          make_latest: true
          files: RemoteTV-*.apk
          body: |
            Install on your Android phone: download **RemoteTV-v1.1.${{ github.run_number }}.apk** below, open it and allow "Install unknown apps" for your browser.
            **RemoteTV-TVHelper** is the small app for the TV that makes *Draw on TV* work. The phone app can install it for you (Advanced mode), or install it on the TV with the Downloader app.
            Works without a PC for Sony BRAVIA, Android TV / Google TV and Roku. Built from ${{ github.sha }}.
            This APK is built only by GitHub Actions from the commit above and carries a signed build attestation (see the repository's Attestations tab).
